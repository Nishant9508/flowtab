services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flowtab
      POSTGRES_PASSWORD: flowtab_password
      POSTGRES_DB: flowtab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: on-failure
    volumes:
      - ./backend:/app
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://flowtab:flowtab_password@db:5432/flowtab
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
