name: CI checks
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check-banned-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned strings
        run: ./check-banned-strings.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest ruff httpx fastapi "uvicorn[standard]"
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
      - name: Test with pytest
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
      - name: Test
        run: |
          cd frontend
          npm run test --passWithNoTests
